name: Execução Manual & Diagnóstico

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Comando a ser executado"
        required: true
        default: "dry-run"
        type: choice
        options:
          - "dry-run"
          - "collect"
          - "publish"
          - "bootstrap"
          - "status"
          - "health"

jobs:
  run-manual:
    name: "Executar: ${{ github.event.inputs.action }}"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Instalar Dependências
        run: npm ci

      - name: Executar Ação Selecionada
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_DEFAULT: ${{ secrets.DISCORD_WEBHOOK_DEFAULT }}
          DISCORD_WEBHOOK_INTERN: ${{ secrets.DISCORD_WEBHOOK_INTERN }}
          DISCORD_WEBHOOK_JUNIOR: ${{ secrets.DISCORD_WEBHOOK_JUNIOR }}
          DISCORD_WEBHOOK_MID: ${{ secrets.DISCORD_WEBHOOK_MID }}
          DISCORD_WEBHOOK_SENIOR: ${{ secrets.DISCORD_WEBHOOK_SENIOR }}
          DISCORD_WEBHOOK_BRAZIL_REMOTE: ${{ secrets.DISCORD_WEBHOOK_BRAZIL_REMOTE }}
          DISCORD_WEBHOOK_INTERNATIONAL: ${{ secrets.DISCORD_WEBHOOK_INTERNATIONAL }}
          DISCORD_WEBHOOK_USD: ${{ secrets.DISCORD_WEBHOOK_USD }}
          DRY_RUN: ${{ secrets.DRY_RUN || 'false' }}
          LOG_LEVEL: info
        run: npm run ${{ github.event.inputs.action }}
